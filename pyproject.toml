[project]
name = "genericagent"
version = "0.1.0"
description = "A physical-level general agent with system-level control capabilities"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "beautifulsoup4>=4.14.3",
    "bottle>=0.13.4",
    "dingtalk-stream>=0.24.3",
    "langfuse>=4.5.0",
    "lark-oapi>=1.5.5",
    "markdown>=3.10.2",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "pillow>=12.2.0",
    "pycryptodome>=3.23.0",
    "pyside6>=6.11.0",
    "python-telegram-bot>=22.7",
    "pywebview>=6.2.1",
    "pywin32>=311",
    "qq-botpy>=1.2.1",
    "qrcode[pil]>=8.2",
    "rapidocr-onnxruntime>=1.4.4",
    "requests>=2.33.1",
    "simple-websocket-server>=0.4.4",
    "streamlit>=1.56.0",
    "uiautomator2>=3.5.0",
    "ultralytics>=8.4.41",
    "urllib3>=2.6.3",
    "wecom-aibot-sdk>=1.0.6",
    "yara-python>=4.5.4",
]
