[project]
name = "genericagent"
version = "0.1.0"
description = "Minimalist self-evolving autonomous agent framework"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "streamlit>=1.28",
    "pywebview>=4.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
qt = ["PySide6>=6.5"]
browser = [
    "bottle>=0.12",
    "simple-websocket-server>=0.4",
]
tg = ["python-telegram-bot>=20.0"]
qq = ["qq-botpy>=1.0"]
wechat = ["qrcode>=7.4", "pycryptodome>=3.19"]
feishu = ["lark-oapi>=1.0"]
wecom = ["wecom-aibot-sdk>=1.0"]
dingtalk = ["dingtalk-stream>=1.0"]
ocr = ["rapidocr-onnxruntime>=1.3", "pillow>=9.0"]
vision = ["ultralytics>=8.0", "pillow>=9.0", "numpy>=1.24"]
langfuse = ["langfuse>=2.0"]
dev = ["pytest>=7.0"]
all = [
    "genericagent[qt]",
    "genericagent[browser]",
    "genericagent[tg]",
    "genericagent[qq]",
    "genericagent[wechat]",
    "genericagent[feishu]",
    "genericagent[wecom]",
    "genericagent[dingtalk]",
    "genericagent[ocr]",
    "genericagent[vision]",
    "genericagent[langfuse]",
]

[tool.setuptools]
py-modules = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
