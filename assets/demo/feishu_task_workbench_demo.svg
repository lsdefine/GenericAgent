<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-label="飞书长任务流效果示例">
  <rect width="1320" height="820" fill="#f5f6f8"/>
  <rect x="0" y="0" width="1320" height="72" fill="#ffffff"/>
  <circle cx="38" cy="36" r="22" fill="#c7d7f2"/>
  <text x="74" y="33" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#202124">小GA</text>
  <text x="128" y="33" font-family="Arial, sans-serif" font-size="15" fill="#8b949e">GA m2pro 小GA 自媒体助理</text>
  <rect x="310" y="16" width="50" height="26" rx="6" fill="#fff0cf"/>
  <text x="323" y="34" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#b36b00">机器人</text>

  <g transform="translate(66 98)">
