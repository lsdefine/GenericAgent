    <circle cx="32" cy="228" r="4" fill="#2f6df6"/>
    <text x="52" y="235" font-family="Arial, sans-serif" font-size="20" fill="#1f2328">轮次：3</text>

    <text x="22" y="292" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2328">最近进展</text>
    <text x="22" y="326" font-family="Arial, sans-serif" font-size="20" fill="#1f2328">1. 任务 1：运行命令/脚本：curl -s "https://api.github.com/repos/lsdefine/GenericAgent...</text>
    <text x="22" y="358" font-family="Arial, sans-serif" font-size="20" fill="#1f2328">2. 任务 2：补 summary，继续分析 GA 上游最近改动的可借鉴点</text>
    <text x="22" y="390" font-family="Arial, sans-serif" font-size="20" fill="#1f2328">3. 任务 3：筛选关键 commit，获取 goal_mode、lifecycle hook、飞书接口等改动的详细 diff</text>

    <text x="22" y="448" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2328">最终输出</text>
    <text x="22" y="486" font-family="Arial, sans-serif" font-size="20" fill="#1f2328">结论已通过富文本消息发送。</text>

    <line x1="22" y1="520" x2="1188" y2="520" stroke="#d8dee4"/>
    <text x="22" y="562" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2328">过程记录</text>
    <text x="22" y="600" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">第 1 轮 · 运行命令/脚本：curl -s "https://api.github.com/repos/lsdefine/GenericAgent/commits?per_page=20" ...</text>
    <text x="22" y="636" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">第 2 轮 · 补 summary，继续分析 GA 上游最近改动的可借鉴点</text>
    <text x="22" y="672" font-family="Arial, sans-serif" font-size="18" fill="#6b7280">第 3 轮 · 筛选关键 commit，获取 goal_mode、lifecycle hook、飞书接口等改动的详细 diff</text>
  </g>

  <g transform="translate(66 705)">
