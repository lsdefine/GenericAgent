    <rect width="1210" height="82" rx="3" fill="#dcf8dc"/>
    <text x="16" y="33" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">回复 池池：你学一下 Github - lsdefine/GenericAgent 最近做了哪些改动，对你有帮助的列出来</text>
