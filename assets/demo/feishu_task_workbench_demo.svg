    <text x="22" y="128" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f2328">状态</text>
    <circle cx="32" cy="164" r="4" fill="#2f6df6"/>
    <text x="52" y="171" font-family="Arial, sans-serif" font-size="20" fill="#1f2328">当前：✅ 已完成</text>
    <circle cx="32" cy="196" r="4" fill="#2f6df6"/>
